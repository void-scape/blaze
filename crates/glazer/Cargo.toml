[package]
name = "glazer"
version = "0.1.0"
edition = "2024"

[features]
default = ["generic"]
generic = ["dep:libc", "dep:winit", "dep:softbuffer", "dep:cpal"]

[dependencies]
libc = { version = "0.2.176", optional = true }
winit = { version = "0.30.12", optional = true }
softbuffer = { version = "0.4.6", optional = true }
cpal = { version = "0.15", optional = true }
