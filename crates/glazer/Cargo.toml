[package]
name = "glazer"
version = "0.1.0"
edition = "2024"

[features]
default = ["opengl", "audio", "hot-reload"]
audio = ["cpal"]
software = ["softbuffer", "tint"]
opengl = ["glow", "glutin", "glutin-winit", "glow/debug_automatic_glGetError"]
hot-reload = ["libc"]

[dependencies]
cpal = { version = "0.15", optional = true }
libc = { version = "0.2", optional = true }
glow = { version = "0.16", optional = true }
tint = { path = "../tint", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = [
	"rwh_06",
	"x11",
] }
softbuffer = { version = "0.4", optional = true, default-features = false, features = [
	"x11",
	"x11-dlopen",
] }
glutin = { version = "0.32", optional = true, default-features = false, features = [
	"egl",
] }
glutin-winit = { version = "0.5", optional = true, default-features = false, features = [
	"egl",
] }


[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", optional = true, default-features = false }
glutin = { version = "0.32", optional = true, default-features = false, features = [
	"egl",
] }
glutin-winit = { version = "0.5", optional = true, default-features = false, features = [
	"egl",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.15", features = ["wasm-bindgen"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", optional = true, default-features = false }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Performance"] }
console_error_panic_hook = "0.1"
